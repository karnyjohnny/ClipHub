name: Build & Test ClipHub

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  # Jedyny job, którego potrzebujemy do kompilacji pod Windowsa: Linux + MinGW-w64 (statyczny link)
  build-cross-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install MinGW-w64 & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix cmake make

      - name: Clean Any Stale Build Folders
        run: |
          rm -rf build-tests build-win64 dist

      - name: Build Core Tests (Linux Native)
        run: |
          cmake -B build-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tests -j$(nproc)
          ./build-tests/cliphub_tests

      - name: Cross-Compile Win64 ClipHub.exe (Static MinGW)
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-mingw64.cmake -B build-win64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win64 -j$(nproc)

      - name: Verify Executable Architecture
        run: |
          file build-win64/ClipHub.exe

      - name: Package Release Artifact
        run: |
          mkdir -p dist
          if [ -f "build-win64/ClipHub.exe" ]; then
            cp build-win64/ClipHub.exe dist/
          fi
          if [ -f "build-win64/cliphub_tests.exe" ]; then
            cp build-win64/cliphub_tests.exe dist/
          fi
          cp README.md dist/
          cp LICENSE dist/
          cp docs/win7-compatibility.md dist/
          cd dist && zip -r ClipHub-Windows-x64.zip *

      - name: Upload Windows Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipHub-Windows-x64
          path: |
            dist/ClipHub.exe
            dist/cliphub_tests.exe
            dist/ClipHub-Windows-x64.zip
          retention-days: 14

  # Job publikujący Release na GitHubie
  publish-release:
    name: Create GitHub Release & Upload Binaries
    needs: [build-cross-linux]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ClipHub-Windows-x64
          path: release-dist/

      - name: Determine Release Tag
        id: tag_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "name=ClipHub ${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.1.0" >> "$GITHUB_OUTPUT"
            echo "name=ClipHub v0.1.0-win7-x64" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: ${{ steps.tag_info.outputs.name }}
          body: |
            ### ClipHub Release (Windows 7 SP1 x64)
            Ultra-lightweight Win32 / Direct2D 1.0 native clipboard manager.
            Built with MinGW-w64 (Zero MSVC / Universal CRT dependencies).
          draft: false
          prerelease: false
          files: |
            release-dist/ClipHub.exe
            release-dist/ClipHub-Windows-x64.zip
            release-dist/cliphub_tests.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}